<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task API — Metrics dashboard</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<!-- Alpine and the dashboardApp component are bundled together by frontend/. -->
<script defer src="/static/js/dashboard.js"></script>
<!-- Applies the saved theme before first paint. Must stay identical to the
     copy in index.html — see the comment there for why it can't be shared. -->
<script>try{const t=localStorage.getItem("task-api-theme");document.documentElement.dataset.theme=t==="dark"||t==="light"?t:"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
<link rel="stylesheet" href="/static/css/theme.css">
<style>
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: .75rem; padding: .9rem; }
  .stat-label { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; }
  .stat-value { font-size: 1.5rem; font-weight: 600; margin-top: .15rem; }
  .stat-value.bad { color: var(--danger); }
  .controls { display: flex; align-items: center; gap: .6rem; padding: 0 .9rem .9rem; border-bottom: 1px solid var(--line); }
  .controls label { color: var(--muted); font-size: .8rem; }
  .stale { color: var(--muted); font-size: .78rem; margin-left: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  th, td { text-align: right; padding: .5rem .75rem; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; }
  tbody tr:last-child td { border-bottom: 0; }
  td.errors.has-errors { color: var(--danger); font-weight: 600; }
  .empty { padding: 2rem; text-align: center; color: var(--muted); }
  .error {
    margin: .75rem 0 0; padding: .6rem .75rem; border-radius: 6px;
    background: color-mix(in srgb, var(--danger) 12%, transparent);
    border: 1px solid var(--danger); color: var(--danger); font-size: .85rem;
  }
</style>
</head>
<body>
<!-- init() is called automatically by Alpine; no x-init needed. -->
<div class="wrap" x-data="dashboardApp" x-cloak>

  <div class="head">
    <h1>Request dashboard</h1>
    <button class="theme-toggle" type="button"
            @click="$store.theme.toggle()"
            :aria-label="$store.theme.label"
            :title="$store.theme.label"
            x-text="$store.theme.isDark ? '☀' : '☾'"></button>
  </div>
  <p class="sub">Basic golden signals — rate, errors, duration — recorded straight
    into Postgres. No external service. <a href="/">← Back to tasks</a></p>

  <div class="panel">
    <div class="controls">
      <label for="window">Window</label>
      <select id="window" x-model.number="windowMinutes" @change="load()">
        <option value="15">Last 15 minutes</option>
        <option value="60">Last hour</option>
        <option value="360">Last 6 hours</option>
        <option value="1440">Last 24 hours</option>
      </select>
      <span class="stale" x-show="summary" x-text="summary ? `updated ${new Date(summary.generated_at).toLocaleTimeString()}` : ''"></span>
    </div>

    <template x-if="loading && !summary">
      <div class="empty">Loading…</div>
    </template>

    <template x-if="summary">
      <div class="stats">
        <div>
          <div class="stat-label">Requests</div>
          <div class="stat-value" x-text="summary.total_requests"></div>
        </div>
        <div>
          <div class="stat-label">Errors</div>
          <div class="stat-value" :class="{ bad: summary.total_errors > 0 }" x-text="summary.total_errors"></div>
        </div>
        <div>
          <div class="stat-label">Error rate</div>
          <div class="stat-value" :class="{ bad: summary.total_errors > 0 }" x-text="errorRatePercent"></div>
        </div>
      </div>
    </template>

    <template x-if="summary && recentBuckets.length === 0">
      <div class="empty">No requests recorded in this window yet.</div>
    </template>

    <template x-if="recentBuckets.length > 0">
      <table>
        <thead>
          <tr>
            <th>Minute</th>
            <th>Requests</th>
            <th>Errors</th>
            <th>Avg ms</th>
            <th>Max ms</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="bucket in recentBuckets" :key="bucket.minute">
            <tr>
              <td x-text="new Date(bucket.minute).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })"></td>
              <td x-text="bucket.count"></td>
              <td class="errors" :class="{ 'has-errors': bucket.errors > 0 }" x-text="bucket.errors"></td>
              <td x-text="bucket.avg_duration_ms"></td>
              <td x-text="bucket.max_duration_ms"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </template>
  </div>

  <template x-if="error">
    <p class="error" x-text="error"></p>
  </template>

</div>
</body>
</html>
