# Local development database.
#
# These credentials are deliberately trivial and are for local use only —
# production supplies DATABASE_URL from the platform's secret store.
#
#   docker compose up -d      start Postgres in the background
#   docker compose down       stop it (data survives)
#   docker compose down -v    stop it and delete the data volume

services:
  db:
    image: postgres:17-alpine
    container_name: taskapi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskapi
      POSTGRES_PASSWORD: taskapi
      POSTGRES_DB: taskapi
    ports:
      # Bound to localhost only, so the database is not exposed on the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on first initialisation of the volume; creates taskapi_test.
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskapi -d taskapi"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      # Explicit, so this can never accidentally pick up the dev stage.
      target: production
    container_name: taskapi-api
    restart: unless-stopped
    depends_on:
      db:
        # Wait for Postgres to accept connections, not merely to start,
        # otherwise the entrypoint's `alembic upgrade` races the database.
        condition: service_healthy
    environment:
      # `db` is the compose service name, resolved on the internal network.
      DATABASE_URL: postgresql+psycopg://taskapi:taskapi@db:5432/taskapi
      WEB_CONCURRENCY: 2
      # Plain http locally; Secure cookies would never be sent back by the
      # browser and login would silently appear broken.
      SESSION_COOKIE_SECURE: "false"
      # Pulled from a local, gitignored .env file if you want to actually
      # exercise Google login against this container. Note: Google Cloud
      # Console has http://127.0.0.1:5000/auth/google/callback registered
      # (the `python app.py` dev server), not :8000 — add the :8000 callback
      # too if you want login to work through this container specifically.
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-not-for-production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dev-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dev-client-secret}
    ports:
      - "127.0.0.1:8000:8000"

  # --- development helpers --------------------------------------------------
  # Under the "dev" profile, so a plain `docker compose up` ignores them.
  # Run with: docker compose --profile dev run --rm <service>

  test:
    build:
      context: .
      target: dev
    depends_on:
      db:
        condition: service_healthy
    profiles: ["dev"]
    environment:
      DATABASE_URL: postgresql+psycopg://taskapi:taskapi@db:5432/taskapi
      TEST_DATABASE_URL: postgresql+psycopg://taskapi:taskapi@db:5432/taskapi_test
      # The suite applies migrations itself; the entrypoint must not race it.
      RUN_MIGRATIONS: "0"
    volumes:
      # Source is mounted, not baked in, so edits take effect without rebuilding.
      - ./backend:/app/backend
      - ./static:/app/static
    # The mount is owned by the host user but the container runs as appuser, so
    # pytest cannot write .pytest_cache. Nothing here needs it.
    command: ["pytest", "tests/", "-q", "-p", "no:cacheprovider"]

  frontend:
    build:
      context: .
      target: frontend-dev
    profiles: ["dev"]
    # The image's "node" user is uid 1000, matching a typical host account, so
    # the bundle written into static/ stays editable from the host rather than
    # landing root-owned.
    user: node
    volumes:
      # Only sources are mounted; node_modules comes from the image, so the
      # host never needs npm installed.
      - ./frontend/src:/build/frontend/src:ro
      - ./frontend/tsconfig.json:/build/frontend/tsconfig.json:ro
      - ./static:/build/static

volumes:
  pgdata:
