# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Render builds the Dockerfile from this repo on every push to main, so no
# image is pulled from a registry and GHCR data transfer stays at zero.
# GHCR remains the archive CI publishes for rollback and local debugging.

services:
  - type: web
    name: task-api
    runtime: docker
    plan: free
    region: oregon

    dockerfilePath: ./Dockerfile
    dockerContext: .
    # No dockerTarget needed: the Dockerfile's last stage is the `production`
    # alias, so the default build target is already correct.

    # Liveness only — deliberately does not touch the database, so a Postgres
    # blip does not make Render restart the service.
    healthCheckPath: /healthz

    autoDeploy: true

    envVars:
      # Set in the Render dashboard, never committed. Use Neon's *direct*
      # (non-pooled) connection string, with the scheme rewritten:
      #   postgresql://...        ->  postgresql+psycopg://...
      # and keep ?sslmode=require — Neon requires TLS.
      - key: DATABASE_URL
        sync: false

      # Signs the session cookie. Generate with: python -c "import secrets;
      # print(secrets.token_hex(32))" — set once in the dashboard, never
      # committed, same treatment as DATABASE_URL.
      - key: SECRET_KEY
        sync: false

      # From Google Cloud Console → APIs & Services → Credentials. The Client
      # ID isn't sensitive on its own, but keeping both dashboard-only avoids
      # mixing "committed config" and "dashboard config" for one feature.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # The free instance has 512 MB RAM; two sync workers fit comfortably.
      - key: WEB_CONCURRENCY
        value: 2

      # Grafana Cloud's OTLP gateway URL, e.g.
      # https://otlp-gateway-<region>.grafana.net/otlp -- from Grafana
      # Cloud's "Configure" page for a stack. Unset means no telemetry is
      # exported at all (otel.py becomes a no-op), so this is optional.
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false

      # "Authorization=Basic <base64 of instanceID:apiToken>", from the same
      # Grafana Cloud page. Never committed, same treatment as SECRET_KEY.
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
